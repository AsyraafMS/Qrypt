rules:
- id: qrypt.javascript.rsa-keygen
  languages:
  - javascript
  severity: WARNING
  message: RSA key-generation is a PQC migration candidate requiring review.
  patterns:
  - &node-keygen
    pattern-either:
    - patterns:
      - &node-namespace
        pattern-either:
        - pattern-inside: |-
            import * as $CRYPTO from $MODULE;
            ...
        - pattern-inside: |-
            import $CRYPTO from $MODULE;
            ...
        - pattern-inside: |-
            const $CRYPTO = require($MODULE);
            ...
      - pattern-either:
        - pattern: $CRYPTO.generateKeyPairSync($ARG, ...)
        - pattern: $CRYPTO.generateKeyPair($ARG, ...)
      - pattern-not-inside: function $F(..., {$CRYPTO}, ...) { ... }
      - pattern-not-inside: function (..., {$CRYPTO}, ...) { ... }
      - pattern-not-inside: (..., {$CRYPTO}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: $CRYPTO}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: $CRYPTO}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: $CRYPTO}, ...) => ...'
      - pattern: $CALLEE($ARG, ...)
      - metavariable-pattern:
          metavariable: $CALLEE
          language: generic
          pattern: $CRYPTO.$MEMBER
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPairSync as $FUNC } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPairSync: $FUNC } = require($MODULE);
            ...
        - pattern-inside: |-
            import { generateKeyPair as $FUNC } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPair: $FUNC } = require($MODULE);
            ...
      - pattern: $FUNC($ARG, ...)
      - pattern-not-inside: function $F(..., {$FUNC}, ...) { ... }
      - pattern-not-inside: function (..., {$FUNC}, ...) { ... }
      - pattern-not-inside: (..., {$FUNC}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: $FUNC}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: $FUNC}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: $FUNC}, ...) => ...'
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPairSync } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPairSync } = require($MODULE);
            ...
      - pattern: generateKeyPairSync($ARG, ...)
      - pattern-not-inside: function $F(..., generateKeyPairSync, ...) { ... }
      - pattern-not-inside: function (..., generateKeyPairSync, ...) { ... }
      - pattern-not-inside: (..., generateKeyPairSync, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const generateKeyPairSync = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let generateKeyPairSync = ...;
          ...
          }
      - pattern-not-inside: function generateKeyPairSync(...) { ... }
      - pattern-not-inside: |-
          {
          ...
          var generateKeyPairSync = ...;
          ...
          }
      - pattern-not-inside: function $F(..., {generateKeyPairSync}, ...) { ... }
      - pattern-not-inside: function (..., {generateKeyPairSync}, ...) { ... }
      - pattern-not-inside: (..., {generateKeyPairSync}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: generateKeyPairSync}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: generateKeyPairSync}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: generateKeyPairSync}, ...) => ...'
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPair } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPair } = require($MODULE);
            ...
      - pattern: generateKeyPair($ARG, ...)
      - pattern-not-inside: function $F(..., generateKeyPair, ...) { ... }
      - pattern-not-inside: function (..., generateKeyPair, ...) { ... }
      - pattern-not-inside: (..., generateKeyPair, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const generateKeyPair = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let generateKeyPair = ...;
          ...
          }
      - pattern-not-inside: function generateKeyPair(...) { ... }
      - pattern-not-inside: |-
          {
          ...
          var generateKeyPair = ...;
          ...
          }
      - pattern-not-inside: function $F(..., {generateKeyPair}, ...) { ... }
      - pattern-not-inside: function (..., {generateKeyPair}, ...) { ... }
      - pattern-not-inside: (..., {generateKeyPair}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: generateKeyPair}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: generateKeyPair}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: generateKeyPair}, ...) => ...'
  - &node-module
    metavariable-regex:
      metavariable: $MODULE
      regex: ^["']?(node:)?crypto["']?$
  - metavariable-regex:
      metavariable: $ARG
      regex: ^["']rsa(-pss)?["']$
  metadata:
    algorithm: RSA
    operation: key-generation
    confidence: high
    guidance: Review whether this key supports encryption or signatures, its lifetime, and compatible PQC migration options; do not replace it automatically.
