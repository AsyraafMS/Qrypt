- id: qrypt.javascript.ml-kem-512-keygen
  languages: [javascript]
  severity: INFO
  message: Explicit ML-KEM-512 key generation is cryptographic inventory evidence.
  patterns:
  - *node-keygen
  - *node-module
  - metavariable-regex:
      metavariable: $ARG
      regex: ^["']ml-kem-512["']$
  metadata:
    algorithm: ML-KEM-512
    operation: key-generation
    confidence: high
    inventory_only: true
    guidance: Verify implementation support and deployment context; an observed PQC identifier does not establish system readiness.

