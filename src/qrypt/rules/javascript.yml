        - pattern-inside: |-
            const { createECDH: $FUNC } = require($MODULE);
            ...
      - pattern: $FUNC($ARG, ...)
      - pattern-not-inside: function $F(..., {$FUNC}, ...) { ... }
      - pattern-not-inside: function (..., {$FUNC}, ...) { ... }
      - pattern-not-inside: (..., {$FUNC}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: $FUNC}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: $FUNC}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: $FUNC}, ...) => ...'
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { createECDH } from $MODULE;
            ...
        - pattern-inside: |-
            const { createECDH } = require($MODULE);
            ...
      - pattern: createECDH($ARG, ...)
      - pattern-not-inside: function $F(..., createECDH, ...) { ... }
      - pattern-not-inside: function (..., createECDH, ...) { ... }
      - pattern-not-inside: (..., createECDH, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const createECDH = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let createECDH = ...;
          ...
          }
      - pattern-not-inside: function createECDH(...) { ... }
      - pattern-not-inside: |-
          {
          ...
          var createECDH = ...;
          ...
          }
      - pattern-not-inside: function $F(..., {createECDH}, ...) { ... }
      - pattern-not-inside: function (..., {createECDH}, ...) { ... }
      - pattern-not-inside: (..., {createECDH}, ...) => ...
      - pattern-not-inside: 'function $F(..., {$PROPERTY: createECDH}, ...) { ... }'
      - pattern-not-inside: 'function (..., {$PROPERTY: createECDH}, ...) { ... }'
      - pattern-not-inside: '(..., {$PROPERTY: createECDH}, ...) => ...'
  - *node-module
  metadata:
    algorithm: ECDH
    operation: key-agreement-configuration
    confidence: high
    guidance: Review the key-agreement workflow and confidentiality lifetime; evaluate compatible PQC or hybrid key establishment.
