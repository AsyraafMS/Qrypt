rules:
- id: qrypt.javascript.rsa-keygen
  languages:
  - javascript
  severity: WARNING
  message: RSA key-generation is a PQC migration candidate requiring review.
  patterns:
  - &node-keygen
    pattern-either:
    - patterns:
      - &node-namespace
        pattern-either:
        - pattern-inside: |-
            import * as $CRYPTO from $MODULE;
            ...
        - pattern-inside: |-
            import $CRYPTO from $MODULE;
            ...
        - pattern-inside: |-
            const $CRYPTO = require($MODULE);
            ...
      - pattern-either:
        - pattern: $CRYPTO.generateKeyPairSync($ARG, ...)
        - pattern: $CRYPTO.generateKeyPair($ARG, ...)
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPairSync as $FUNC } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPairSync: $FUNC } = require($MODULE);
            ...
        - pattern-inside: |-
            import { generateKeyPair as $FUNC } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPair: $FUNC } = require($MODULE);
            ...
      - pattern: $FUNC($ARG, ...)
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPairSync } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPairSync } = require($MODULE);
            ...
      - pattern: generateKeyPairSync($ARG, ...)
      - pattern-not-inside: function $F(..., generateKeyPairSync, ...) { ... }
      - pattern-not-inside: function (..., generateKeyPairSync, ...) { ... }
      - pattern-not-inside: (..., generateKeyPairSync, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const generateKeyPairSync = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let generateKeyPairSync = ...;
          ...
          }
      - pattern-not-inside: function generateKeyPairSync(...) { ... }
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { generateKeyPair } from $MODULE;
            ...
        - pattern-inside: |-
            const { generateKeyPair } = require($MODULE);
            ...
      - pattern: generateKeyPair($ARG, ...)
      - pattern-not-inside: function $F(..., generateKeyPair, ...) { ... }
      - pattern-not-inside: function (..., generateKeyPair, ...) { ... }
      - pattern-not-inside: (..., generateKeyPair, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const generateKeyPair = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let generateKeyPair = ...;
          ...
          }
      - pattern-not-inside: function generateKeyPair(...) { ... }
  - &node-module
    metavariable-regex:
      metavariable: $MODULE
      regex: ^["']?(node:)?crypto["']?$
  - metavariable-regex:
      metavariable: $ARG
      regex: ^["']rsa(-pss)?["']$
  metadata:
    algorithm: RSA
    operation: key-generation
    confidence: high
    guidance: Review whether this key supports encryption or signatures, its lifetime, and compatible PQC migration options; do not replace it automatically.
- id: qrypt.javascript.ec-keygen
  languages:
  - javascript
  severity: WARNING
  message: EC key-generation is a PQC migration candidate requiring review.
  patterns:
  - *node-keygen
  - *node-module
  - metavariable-regex:
      metavariable: $ARG
      regex: ^["']ec["']$
  metadata:
    algorithm: EC
    operation: key-generation
    confidence: high
    guidance: Determine whether the key is used for signatures or key agreement before selecting a compatible PQC migration path.
- id: qrypt.javascript.dh-keygen
  languages:
  - javascript
  severity: WARNING
  message: DH key-generation is a PQC migration candidate requiring review.
  patterns:
  - *node-keygen
  - *node-module
  - metavariable-regex:
      metavariable: $ARG
      regex: ^["']dh["']$
  metadata:
    algorithm: DH
    operation: key-generation
    confidence: high
    guidance: Review the key-agreement workflow and confidentiality lifetime; evaluate compatible PQC or hybrid key establishment.
- id: qrypt.javascript.ecdh
  languages:
  - javascript
  severity: WARNING
  message: ECDH key-agreement-configuration is a PQC migration candidate requiring review.
  patterns:
  - pattern-either:
    - patterns:
      - *node-namespace
      - pattern-either:
        - pattern: $CRYPTO.createECDH($ARG, ...)
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { createECDH as $FUNC } from $MODULE;
            ...
        - pattern-inside: |-
            const { createECDH: $FUNC } = require($MODULE);
            ...
      - pattern: $FUNC($ARG, ...)
    - patterns:
      - pattern-either:
        - pattern-inside: |-
            import { createECDH } from $MODULE;
            ...
        - pattern-inside: |-
            const { createECDH } = require($MODULE);
            ...
      - pattern: createECDH($ARG, ...)
      - pattern-not-inside: function $F(..., createECDH, ...) { ... }
      - pattern-not-inside: function (..., createECDH, ...) { ... }
      - pattern-not-inside: (..., createECDH, ...) => ...
      - pattern-not-inside: |-
          {
          ...
          const createECDH = ...;
          ...
          }
      - pattern-not-inside: |-
          {
          ...
          let createECDH = ...;
          ...
          }
      - pattern-not-inside: function createECDH(...) { ... }
  - *node-module
  metadata:
    algorithm: ECDH
    operation: key-agreement-configuration
    confidence: high
    guidance: Review the key-agreement workflow and confidentiality lifetime; evaluate compatible PQC or hybrid key establishment.
