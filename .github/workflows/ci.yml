name: QRYPT CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/qrypt-wheel
          /tmp/qrypt-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/qrypt-wheel/bin/qrypt scan "$GITHUB_WORKSPACE/examples" --format sarif --output /tmp/wheel.sarif
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t qrypt:ci .
      - name: Scan read-only sources offline
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m -v "$PWD:/workspace:ro" qrypt:ci scan . --format sarif > container.sarif
          python -c 'import json; r=json.load(open("container.sarif")); assert r["runs"][0]["invocations"][0]["executionSuccessful"]'
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Scan repository (advisory)
        id: scan
        run: qrypt scan . --format sarif --output qrypt.sarif
      - name: Preserve report and incomplete-scan diagnostics
        if: always() && hashFiles('qrypt.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qrypt-sarif
          path: qrypt.sarif
      # Public repos support Code Scanning; private availability requires a suitable plan.
      - name: Upload completed public-repository scan
        if: success() && steps.scan.outcome == 'success' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: qrypt.sarif
          category: qrypt-source
