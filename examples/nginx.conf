# Literal declarations for scanning only; not a runnable server deployment.
server {
    ssl_ecdh_curve X25519:secp384r1;
    ssl_conf_command SignatureAlgorithms rsa_pss_rsae_sha256:ecdsa_secp256r1_sha256;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:!aECDSA;
    ssl_dhparam /example/dhparams.pem;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
}
